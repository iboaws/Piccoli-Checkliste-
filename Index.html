<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Piccoli – Checkliste</title>
<style>
  :root{
    --green:#00953F; --red:#E10613; --dark:#070209;
    --bg:#ffffff; --card:#ffffff; --sectionbg:#E3F2E9; --text:#1a1a1a; --muted:#6b6b6b; --border:#e4e4e4;
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#111111; --card:#1a1a1a; --sectionbg:#123322; --text:#f0f0f0; --muted:#a0a0a0; --border:#2c2c2c;
    }
  }
  :root[data-theme="dark"]{
    --bg:#111111; --card:#1a1a1a; --sectionbg:#123322; --text:#f0f0f0; --muted:#a0a0a0; --border:#2c2c2c;
  }
  html{ scroll-padding-top: env(safe-area-inset-top, 0px); height:100%; }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100%;
    padding-bottom: calc(90px + env(safe-area-inset-bottom, 0px));
  }
  header.top{
    background:var(--dark); padding:16px 16px 14px;
    padding-top: calc(16px + env(safe-area-inset-top, 0px));
    display:flex; align-items:center; gap:12px;
  }
  header.top img{height:46px; width:auto; display:block;}
  header.top .title{color:#fff;}
  header.top .title b{font-size:17px; display:block;}
  header.top .title span{font-size:12px; opacity:.8;}
  .stripe{height:6px; display:flex;}
  .stripe div{flex:1;}
  .stripe .g{background:var(--green);} .stripe .w{background:#fff;} .stripe .r{background:var(--red);}

  .tabs{
    display:flex; gap:6px; padding:10px 12px; background:var(--bg);
    position:sticky; top:0; z-index:5; border-bottom:1px solid var(--border);
  }
  .tab{
    flex:1; text-align:center; padding:9px 4px; border-radius:10px; font-size:13.5px; font-weight:600;
    background:var(--card); border:1px solid var(--border); color:var(--muted); cursor:pointer; user-select:none;
  }
  .tab.active{background:var(--green); color:#fff; border-color:var(--green);}

  main{padding:14px 14px 4px; max-width:640px; margin:0 auto;}

  .meta{display:flex; gap:8px; margin-bottom:14px;}
  .meta input{
    flex:1; padding:10px 12px; border-radius:10px; border:1px solid var(--border);
    background:var(--card); color:var(--text); font-size:14px;
  }
  .progress-wrap{
    background:var(--card); border:1px solid var(--border); border-radius:12px; padding:10px 14px; margin-bottom:16px;
    display:flex; align-items:center; gap:10px;
  }
  .progress-bar{flex:1; height:8px; background:var(--border); border-radius:6px; overflow:hidden;}
  .progress-bar > div{height:100%; background:var(--green); width:0%; transition:width .25s;}
  .progress-txt{font-size:12.5px; color:var(--muted); white-space:nowrap; font-weight:600;}

  .note-banner{
    font-size:11.5px; color:var(--muted); text-align:center; margin:2px 0 14px; line-height:1.5;
  }

  .section{margin-bottom:16px;}
  .section h3{
    background:var(--sectionbg); border-left:4px solid var(--green);
    padding:8px 10px; margin:0 0 8px; border-radius:6px; font-size:14.5px;
  }
  .item{
    background:var(--card); border:1px solid var(--border); border-radius:10px;
    padding:10px 12px; margin-bottom:8px;
  }
  .item .row{display:flex; align-items:flex-start; gap:10px; cursor:pointer;}
  .box{
    flex:0 0 22px; width:22px; height:22px; border-radius:6px; border:2px solid var(--red);
    display:flex; align-items:center; justify-content:center; margin-top:1px;
  }
  .box svg{width:14px; height:14px; opacity:0; transition:opacity .12s;}
  .item.checked .box{background:var(--red);}
  .item.checked .box svg{opacity:1;}
  .item.checked .box svg path{stroke:#fff;}
  .txt{font-size:14px; line-height:1.4;}
  .item.checked .txt{color:var(--muted); text-decoration:line-through;}
  .notes{margin:6px 0 0 32px; padding:0; list-style:none;}
  .notes li{font-size:12.5px; color:var(--muted); position:relative; padding-left:12px; margin-bottom:2px; line-height:1.4;}
  .notes li:before{content:"•"; color:var(--green); position:absolute; left:0;}
  .notes li.warn{color:var(--red); font-weight:600;}
  .sub{margin-left:32px; margin-top:6px;}
  .sub .item{padding:8px 10px;}
  .sub .box{width:18px; height:18px; flex-basis:18px;}
  .sub .txt{font-size:13px;}

  footer.bar{
    position:fixed; left:0; right:0; bottom:0; background:var(--bg); border-top:1px solid var(--border);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
    display:flex; gap:10px; z-index:10;
  }
  footer.bar button, footer.bar a{
    flex:1; border:none; border-radius:11px; padding:13px; font-size:15px; font-weight:700; cursor:pointer;
    text-align:center; text-decoration:none; display:flex; align-items:center; justify-content:center;
  }
  #resetBtn{background:var(--card); color:var(--text); border:1px solid var(--border);}
  #sendBtn{background:var(--green); color:#fff;}
  #sendBtn:visited, #sendBtn:link{color:#fff;}
  #sendBtn:disabled, #sendBtn.disabled{opacity:.5; pointer-events:none;}

  .toast{
    position:fixed; left:50%; bottom:96px; transform:translateX(-50%) translateY(20px); opacity:0;
    background:var(--dark); color:#fff; padding:11px 18px; border-radius:20px; font-size:13.5px;
    transition:all .25s; z-index:20; max-width:88%; text-align:center; pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .hist-card{
    background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:10px;
  }
  .hist-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;}
  .hist-top b{font-size:14px;}
  .badge{font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px;}
  .badge.ok{background:#e3f2e9; color:var(--green);}
  .badge.warn{background:#fdeceb; color:var(--red);}
  .hist-sub{font-size:12px; color:var(--muted);}
  .empty{text-align:center; color:var(--muted); font-size:13.5px; padding:30px 10px;}
  .loading{text-align:center; color:var(--muted); font-size:13px; padding:20px;}
</style>
</head>
<body>

<header class="top">
  <img id="logoImg" alt="Piccoli Logo">
  <div class="title"><b>Piccoli</b><span>Digitale Checkliste</span></div>
</header>
<div class="stripe"><div class="g"></div><div class="w"></div><div class="r"></div></div>

<div class="tabs">
  <div class="tab active" data-tab="opening">Öffnung</div>
  <div class="tab" data-tab="closing">Schließung</div>
  <div class="tab" data-tab="history">Verlauf</div>
</div>

<main>

  <div id="view-opening" class="view">
    <div class="meta">
      <input id="name-opening" type="text" placeholder="Dein Name" autocomplete="off">
      <input id="date-opening" type="date">
    </div>
    <div class="progress-wrap">
      <div class="progress-bar"><div id="bar-opening"></div></div>
      <div class="progress-txt" id="pct-opening">0 / 0</div>
    </div>
    <div class="note-banner">Ankunft im Laden: 10:00 Uhr&nbsp;&nbsp;|&nbsp;&nbsp;Ladenöffnung: 11:00 Uhr (pünktlich)</div>
    <div id="sections-opening"></div>
  </div>

  <div id="view-closing" class="view" style="display:none">
    <div class="meta">
      <input id="name-closing" type="text" placeholder="Dein Name" autocomplete="off">
      <input id="date-closing" type="date">
    </div>
    <div class="progress-wrap">
      <div class="progress-bar"><div id="bar-closing"></div></div>
      <div class="progress-txt" id="pct-closing">0 / 0</div>
    </div>
    <div class="note-banner">Spätestens um 19:30 Uhr den Laden verlassen!</div>
    <div id="sections-closing"></div>
  </div>

  <div id="view-history" class="view" style="display:none">
    <div id="history-list"><div class="loading">Lade Verlauf…</div></div>
  </div>

</main>

<footer class="bar" id="actionBar">
  <button id="resetBtn">Zurücksetzen</button>
  <a id="sendBtn" class="disabled" href="#" target="_blank" rel="noopener noreferrer">📲 An Chef senden</a>
</footer>

<div class="toast" id="toast"></div>

// ---------- Status ----------
const state = {
  opening: {},
  closing: {},
};

function allItemIds(shift){
  const ids = [];
  SHIFT_DATA[shift].forEach(sec => sec.items.forEach(it => ids.push(it.id)));
  return ids;
}

function todayStr(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}

function slugify(s){
  return (s||'').toLowerCase().trim()
    .replace(/[äöüß]/g, c => ({ä:'ae',ö:'oe',ü:'ue',ß:'ss'}[c]))
    .replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'unbekannt';
}

// ---------- Rendering ----------
function renderShift(shift){
  const host = document.getElementById('sections-'+shift);
  host.innerHTML = '';
  SHIFT_DATA[shift].forEach(sec => {
    const secEl = document.createElement('div');
    secEl.className = 'section';
    const h = document.createElement('h3');
    h.textContent = sec.title;
    secEl.appendChild(h);
    sec.items.forEach(it => secEl.appendChild(renderItem(shift, it)));
    host.appendChild(secEl);
  });
  updateProgress(shift);
}

function renderItem(shift, it){
  const wrap = document.createElement('div');
  wrap.className = 'item';
  wrap.dataset.id = it.id;

  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `<div class="box">${CHECK_SVG}</div><div class="txt">${it.text}</div>`;
  row.addEventListener('click', () => toggleItem(shift, it.id));
  wrap.appendChild(row);

  if (it.notes && it.notes.length){
    const ul = document.createElement('ul');
    ul.className = 'notes';
    it.notes.forEach(n => {
      const li = document.createElement('li');
      if (typeof n === 'string'){ li.textContent = n; }
      else { li.textContent = n.t; if (n.warn) li.classList.add('warn'); }
      ul.appendChild(li);
    });
    wrap.appendChild(ul);
  }
  return wrap;
}

function toggleItem(shift, id){
  state[shift][id] = !state[shift][id];
  const el = document.querySelector(`#sections-${shift} .item[data-id="${id}"]`);
  el.classList.toggle('checked', !!state[shift][id]);
  updateProgress(shift);
  saveLocal();
  refreshSendLink();
}

function updateProgress(shift){
  const ids = allItemIds(shift);
  const done = ids.filter(id => state[shift][id]).length;
  const pct = ids.length ? Math.round(done/ids.length*100) : 0;
  document.getElementById('bar-'+shift).style.width = pct+'%';
  document.getElementById('pct-'+shift).textContent = `${done} / ${ids.length}`;
}

// ---------- Lokale Persistenz (pro Gerät, nur Komfort) ----------
function saveLocal(){
  try{
    localStorage.setItem('piccoli_checklist_state', JSON.stringify(state));
    localStorage.setItem('piccoli_checklist_name_opening', document.getElementById('name-opening').value);
    localStorage.setItem('piccoli_checklist_name_closing', document.getElementById('name-closing').value);
  }catch(e){}
}
function loadLocal(){
  try{
    const raw = localStorage.getItem('piccoli_checklist_state');
    if (raw){
      const parsed = JSON.parse(raw);
      if (parsed.opening) Object.assign(state.opening, parsed.opening);
      if (parsed.closing) Object.assign(state.closing, parsed.closing);
    }
    const no = localStorage.getItem('piccoli_checklist_name_opening');
    const nc = localStorage.getItem('piccoli_checklist_name_closing');
    if (no) document.getElementById('name-opening').value = no;
    if (nc) document.getElementById('name-closing').value = nc;
  }catch(e){}
}

// ---------- Tabs ----------
let currentTab = 'opening';
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    const target = tab.dataset.tab;
    currentTab = target;
    document.querySelectorAll('.view').forEach(v=>v.style.display='none');
    document.getElementById('view-'+target).style.display='';
    document.getElementById('actionBar').style.display = (target==='history') ? 'none' : 'flex';
    if (target === 'history') loadHistory();
    else refreshSendLink();
  });
});

// ---------- Toast ----------
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove('show'), 2600);
}

// ---------- Reset / Senden ----------
document.getElementById('resetBtn').addEventListener('click', () => {
  const shift = currentTab === 'closing' ? 'closing' : 'opening';
  if (shift !== 'opening' && shift !== 'closing') return;
  state[shift] = {};
  renderShift(shift);
  saveLocal();
  refreshSendLink();
  toast('Zurückgesetzt.');
});

const WHATSAPP_NUMBER = "4917687795744"; // Chef-Nummer (mit Ländercode, ohne +)

function itemTextLookup(shift){
  const map = {};
  SHIFT_DATA[shift].forEach(sec => sec.items.forEach(it => map[it.id] = it.text.replace(/:$/, '')));
  return map;
}

function buildWhatsAppMessage(shift, name, date, done, total, openItems){
  const lines = [];
  lines.push(`🍦 Piccoli – ${SHIFT_LABEL[shift]}-Checkliste`);
  lines.push(`📅 ${date}   👤 ${name || '(Name fehlt)'}`);
  lines.push(`✅ ${done}/${total} erledigt`);
  if (openItems.length){
    lines.push('');
    lines.push('Noch offen:');
    openItems.forEach(t => lines.push('• ' + t));
  } else {
    lines.push('');
    lines.push('Alles erledigt ✅');
  }
  return lines.join('\n');
}

// Hält den WhatsApp-Link (href) IMMER aktuell, damit der Klick auf den
// Button ein ganz normaler, direkter Link-Klick ist (kein window.open
// aus Skript-Code, das von manchen eingebetteten Ansichten blockiert wird).
function refreshSendLink(){
  const shift = currentTab === 'closing' ? 'closing' : 'opening';
  const link = document.getElementById('sendBtn');
  if (shift !== 'opening' && shift !== 'closing'){
    link.classList.add('disabled');
    return;
  }
  const nameEl = document.getElementById('name-'+shift);
  const dateEl = document.getElementById('date-'+shift);
  const name = nameEl.value.trim();
  const date = dateEl.value || todayStr();
  const ids = allItemIds(shift);
  const done = ids.filter(id => state[shift][id]).length;
  const textMap = itemTextLookup(shift);
  const openItems = ids.filter(id => !state[shift][id]).map(id => textMap[id]);
  const message = buildWhatsAppMessage(shift, name, date, done, ids.length, openItems);
  link.href = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
  link.classList.toggle('disabled', !name);
  link._pendingSave = { shift, date, name, done, total: ids.length, items: {...state[shift]} };
}

let dbNS = null;
document.getElementById('sendBtn').addEventListener('click', (e) => {
  const link = e.currentTarget;
  const nameEl = document.getElementById('name-'+(currentTab === 'closing' ? 'closing' : 'opening'));
  if (!nameEl.value.trim()){
    e.preventDefault();
    toast('Bitte zuerst deinen Namen eingeben.');
    nameEl.focus();
    return;
  }
  // Link öffnet WhatsApp ganz normal (echter <a target="_blank"> Klick).
  // Zusätzlich, unabhängig davon, im Hintergrund best-effort im Verlauf speichern.
  const payload = link._pendingSave;
  toast('WhatsApp wird geöffnet …');
  (async () => {
    try{
      if (!dbNS){ dbNS = await claude.use('db'); }
      if (dbNS && payload){
        const docId = `${payload.date}_${payload.shift}_${slugify(payload.name)}`;
        await dbNS.doc(`checkins/${docId}`).set({
          shift: payload.shift, shiftLabel: SHIFT_LABEL[payload.shift],
          date: payload.date, employee: payload.name,
          total: payload.total, done: payload.done,
          allDone: payload.done === payload.total,
          items: payload.items,
          submittedAt: new Date().toISOString(),
        });
      }
    }catch(err){ /* stumm ignorieren – WhatsApp ist der primäre Weg */ }
  })();
});

['name-opening','date-opening','name-closing','date-closing'].forEach(id => {
  document.getElementById(id).addEventListener('input', refreshSendLink);
});

// ---------- Verlauf ----------
async function loadHistory(){
  const host = document.getElementById('history-list');
  host.innerHTML = '<div class="loading">Lade Verlauf…</div>';
  try{
    if (!dbNS){ dbNS = await claude.use('db'); }
    if (!dbNS){
      host.innerHTML = '<div class="empty">Verlauf ist auf diesem Gerät nicht verfügbar.</div>';
      return;
    }
    const snap = await dbNS.collection('checkins').orderBy('submittedAt', 'desc').limit(40).get();
    const rows = (snap && snap.docs) || [];
    if (!rows.length){
      host.innerHTML = '<div class="empty">Noch keine Einträge vorhanden.</div>';
      return;
    }
    host.innerHTML = '';
    rows.forEach(r => {
      const d = r.data();
      const card = document.createElement('div');
      card.className = 'hist-card';
      const dt = new Date(d.submittedAt);
      const timeStr = isNaN(dt) ? '' : dt.toLocaleString('de-DE', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
      card.innerHTML = `
        <div class="hist-top">
          <b>${d.employee || 'Unbekannt'} · ${SHIFT_LABEL[d.shift] || d.shift}</b>
          <span class="badge ${d.allDone ? 'ok':'warn'}">${d.done}/${d.total}</span>
        </div>
        <div class="hist-sub">${d.date || ''} · gesendet ${timeStr}</div>
      `;
      host.appendChild(card);
    });
  }catch(e){
    host.innerHTML = '<div class="empty">Verlauf konnte nicht geladen werden.</div>';
  }
}

// ---------- Init ----------
document.getElementById('date-opening').value = todayStr();
document.getElementById('date-closing').value = todayStr();
loadLocal();
renderShift('opening');
renderShift('closing');
refreshSendLink();
</script>
